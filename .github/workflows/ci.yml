name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: module/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run manifest:check
      - run: npm run build

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - name: Generated schemas are up to date
        run: npm run gen && git diff --exit-code src/generated
      - run: npm test
